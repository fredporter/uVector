[package]
name = "uvcore"
version = "0.1.0"
edition = "2021"
description = "Universal Vector Core — SVG→everything conversion engine for uCode3"
authors = ["OkAgentDigital"]

[dependencies]
# SVG parsing
roxmltree = "0.20"

# Rasterization
tiny-skia = "0.11"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (for Ollama API)
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[lib]
name = "uvcore"
path = "src/lib.rs"

[[bin]]
name = "uvcore"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
